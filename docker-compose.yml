

services:
  db:
    image: postgres:15
    container_name: medicaments_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2004
      POSTGRES_DB: medicaments_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: .
    container_name: medicament_api
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:2004@db:5432/medicaments_db
    volumes:
      - .:/app
volumes:
  postgres_data: